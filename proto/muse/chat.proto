syntax = "proto3";

package muse;

import "muse/common.proto";
import "muse/character.proto";

option go_package = "github.com/ling/muse/gen/muse;muse";

// ================================
// 聊天相关消息
// ================================

// ChatSession 聊天会话，记录与某个角色的对话
message ChatSession {
  int32 id = 1;                    // 会话唯一标识ID
  int32 user_id = 2;               // 所属用户ID
  int32 character_id = 3;          // 关联的角色卡ID
  string name = 4;                 // 会话名称（可选）
  int64 version = 5;               // 乐观锁版本号，用于并发控制
  int64 created_at = 6;            // 创建时间（Unix时间戳）
  int64 updated_at = 7;            // 最后更新时间（Unix时间戳）
  Character character = 8;         // 关联的角色卡详情（可选加载）
  repeated Message messages = 9;   // 会话中的消息列表（可选加载）
}

// Message 聊天消息
message Message {
  int32 id = 1;                        // 消息唯一标识ID
  int32 session_id = 2;                // 所属会话ID
  Role role = 3;                       // 消息角色（用户/助手/系统）
  int32 active_swipe_index = 4;        // 当前激活的swipe索引
  int32 sort_order = 5;                // 消息排序序号，用于确定显示顺序
  int64 created_at = 6;                // 创建时间（Unix时间戳）
  int64 updated_at = 7;                // 最后更新时间（Unix时间戳）
  repeated MessageSwipe swipes = 8;    // 消息内容列表（支持多个候选回复）
}

// MessageSwipe 消息内容变体，支持同一消息的多个候选回复
message MessageSwipe {
  int32 id = 1;          // Swipe唯一标识ID
  int32 message_id = 2;  // 所属消息ID
  string content = 3;    // 消息文本内容
  int64 created_at = 4;  // 创建时间（Unix时间戳）
}

// ================================
// 聊天服务
// ================================

// 获取会话列表请求
message ListChatSessionsReq {
  optional int32 character_id = 1;  // 可选，按角色筛选
  optional int32 page = 2;
  optional int32 page_size = 3;
}

// 获取会话列表响应
message ListChatSessionsRsp {
  repeated ChatSession sessions = 1;
  int32 total = 2;
}

// 获取单个会话请求
message GetChatSessionReq {
  int32 id = 1;
}

// 获取单个会话响应
message GetChatSessionRsp {
  ChatSession session = 1;
}

// 创建会话请求
message CreateChatSessionReq {
  int32 character_id = 1;
  optional string name = 2;
}

// 创建会话响应
message CreateChatSessionRsp {
  ChatSession session = 1;
}

// 更新会话请求
message UpdateChatSessionReq {
  int32 id = 1;
  optional string name = 2;
  int64 version = 3;  // 乐观锁版本号
}

// 更新会话响应
message UpdateChatSessionRsp {
  ChatSession session = 1;
}

// 删除会话请求
message DeleteChatSessionReq {
  int32 id = 1;
}

// 删除会话响应
message DeleteChatSessionRsp {}

// 发送消息请求
message SendMessageReq {
  int32 session_id = 1;
  string content = 2;
}

// 发送消息响应
message SendMessageRsp {
  int32 index = 1; // 多个候选回复时，候选回复的下标
  string content = 2;
  bool done = 3;           // 是否完成
  ErrCode err_code = 4;   // 错误码
  string err_message = 5; // 错误原因
}

// 重新生成消息请求
message RegenerateMessageReq {
  int32 message_id = 1;  // 要重新生成的AI消息ID
}

// 重新生成消息响应（流式）
message RegenerateMessageRsp {
  MessageSwipe new_swipe = 1;  // 新的swipe
  string content_delta = 2;    // 内容增量
  bool done = 3;        // 是否完成
  ErrCode err_code = 4;   // 错误码
  string err_message = 5; // 错误原因
}

// 编辑消息请求
message EditMessageReq {
  int32 message_id = 1;
  int32 swipe_id = 2;     // 要编辑的swipe ID
  string content = 3;      // 新内容
}

// 编辑消息响应
message EditMessageRsp {
  MessageSwipe swipe = 1;
}

// 删除消息请求
message DeleteMessageReq {
  int32 message_id = 1;
}

// 删除消息响应
message DeleteMessageRsp {}

// 切换Swipe请求
message SwitchSwipeReq {
  int32 message_id = 1;
  int32 swipe_index = 2;
}

// 切换Swipe响应
message SwitchSwipeRsp {
  Message message = 1;
}

// 获取角色最新会话请求
message GetCharLatestSessionReq {
  int32 character_id = 1;
}

// 获取角色最新会话响应
message GetCharLatestSessionRsp {
  ChatSession session = 1;
}

// 更新会话时间戳请求
message UpdateSessionTimeReq {
  int32 session_id = 1;
}

// 更新会话时间戳响应
message UpdateSessionTimeRsp {}

// 删除Swipe请求
message DeleteSwipeReq {
  int32 message_id = 1;
  int32 swipe_id = 2;
}

// 删除Swipe响应
message DeleteSwipeRsp {}

// 聊天服务
service ChatService {
  // 获取会话列表
  rpc ListChatSessions(ListChatSessionsReq) returns (ListChatSessionsRsp);
  // 获取单个会话
  rpc GetChatSession(GetChatSessionReq) returns (GetChatSessionRsp);
  // 创建会话
  rpc CreateChatSession(CreateChatSessionReq) returns (CreateChatSessionRsp);
  // 更新会话
  rpc UpdateChatSession(UpdateChatSessionReq) returns (UpdateChatSessionRsp);
  // 删除会话
  rpc DeleteChatSession(DeleteChatSessionReq) returns (DeleteChatSessionRsp);
  // 发送消息（流式响应）
  rpc SendMessage(SendMessageReq) returns (stream SendMessageRsp);
  // 重新生成消息（流式响应）
  rpc RegenerateMessage(RegenerateMessageReq) returns (stream RegenerateMessageRsp);
  // 编辑消息
  rpc EditMessage(EditMessageReq) returns (EditMessageRsp);
  // 删除消息
  rpc DeleteMessage(DeleteMessageReq) returns (DeleteMessageRsp);
  // 切换Swipe
  rpc SwitchSwipe(SwitchSwipeReq) returns (SwitchSwipeRsp);
  // 获取角色最新会话
  rpc GetCharLatestSession(GetCharLatestSessionReq) returns (GetCharLatestSessionRsp);
  // 更新会话时间戳
  rpc UpdateSessionTime(UpdateSessionTimeReq) returns (UpdateSessionTimeRsp);
  // 删除swipe
  rpc DeleteSwipe(DeleteSwipeReq) returns (DeleteSwipeRsp);
}