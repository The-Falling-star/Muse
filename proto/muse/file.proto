syntax = "proto3";

package muse;

option go_package = "github.com/ling/muse/gen/muse;muse";

import "muse/common.proto";

// ================================
// 文件服务相关消息
// ================================

// UploadFileReq 上传文件请求
message UploadFileReq {
  bytes file_content = 1;     // 文件内容
  string file_name = 2;       // 文件名
  FileType file_type = 3; // 文件类型
}

// UploadFileRsp 上传文件响应
message UploadFileRsp {
  string file_path = 1;  // 文件相对路径（相对于用户目录）
}

// DownloadFileReq 下载文件请求
message DownloadFileReq {
  string file_path = 1;  // 文件相对路径（相对于用户目录）
}

// DownloadFileRsp 下载文件响应
message DownloadFileRsp {
  bytes file_content = 1;    // 文件内容
  string content_type = 2;   // 文件MIME类型
  string file_name = 3;      // 文件名
}

// 文件服务
service FileService {
  // 上传文件
  rpc UploadFile(UploadFileReq) returns (UploadFileRsp);
  // 下载文件
  rpc DownloadFile(DownloadFileReq) returns (DownloadFileRsp);
}
