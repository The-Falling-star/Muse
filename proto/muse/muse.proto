syntax = "proto3";

package muse;

option go_package = "github.com/ling/muse/gen/muse;muse";


// ================================
// 枚举定义
// ================================

// Role 消息角色类型
enum Role {
  RoleUnspecified = 0; // 未指定角色
  System = 1;          // 系统消息，用于设定AI行为和上下文
  User = 2;            // 用户消息，用户输入的内容
  Assistant = 3;       // 助手消息，AI生成的回复
}

// InjectionPosition 提示项注入位置类型
enum InjectionPosition {
  InjectionPositionUnspecified = 0; // 未指定位置
  Relative = 1;                     // 相对位置，根据角色类型决定插入位置
  Absolute = 2;                     // 绝对位置，按深度值插入到消息列表中
}

// EntryPosition 世界书条目插入位置
enum EntryPosition {
  EntryPositionUnspecified = 0; // 未指定位置
  BeforeChar = 1;               // 角色描述之前
  AfterChar = 2;                // 角色描述之后
  BeforeExample = 3;            // 示例对话之前
  AfterExample = 4;             // 示例对话之后
  AtDepth = 5;                  // 按深度插入到消息列表中
}

// APIProvider API服务提供商类型
enum APIProvider {
  APIProviderUnspecified = 0; // 未指定提供商
  OpenAI = 1;                 // OpenAI（ChatGPT）
  Claude = 2;                 // Anthropic Claude
  Gemini = 3;                 // Google Gemini
}

// Theme 界面主题类型
enum Theme {
  Auto = 0;  // 自动，跟随系统设置
  Light = 1; // 浅色主题
  Dark = 2;  // 深色主题
}

// ================================
// 用户相关消息
// ================================

// SysUser 系统用户信息
message SysUser {
  int32 id = 1;                 // 用户唯一标识ID
  string username = 2;          // 用户名，用于登录
  int32 active_persona_id = 4;  // 当前激活的用户人设ID
  int32 active_preset_id = 5;   // 当前激活的预设ID
  int64 created_at = 6;         // 创建时间（Unix时间戳）
  int64 updated_at = 7;         // 最后更新时间（Unix时间戳）
}

// Persona 用户人设，定义用户在对话中的身份
message Persona {
  int32 id = 1;           // 人设唯一标识ID
  int32 user_id = 2;      // 所属用户ID
  string name = 3;        // 人设名称
  string avatar = 4;      // 人设头像（Base64编码或URL）
  string description = 5; // 人设描述，定义用户的角色设定
  int64 created_at = 6;   // 创建时间（Unix时间戳）
  int64 updated_at = 7;   // 最后更新时间（Unix时间戳）
}

// UserSetting 用户个性化设置
message UserSetting {
  int32 id = 1;              // 设置记录ID
  int32 user_id = 2;         // 所属用户ID
  Theme theme = 3;           // 界面主题
  string language = 4;       // 语言设置（如 zh-CN、en-US）
  bool send_on_enter = 5;    // 是否按回车键发送消息
  bool show_timestamps = 6;  // 是否显示消息时间戳
  int64 created_at = 7;      // 创建时间（Unix时间戳）
  int64 updated_at = 8;      // 最后更新时间（Unix时间戳）
}

// ================================
// 角色卡相关消息
// ================================

// Character 角色卡，定义AI扮演的角色
message Character {
  int32 id = 1;                  // 角色卡唯一标识ID
  int32 user_id = 2;             // 所属用户ID
  string name = 3;               // 角色名称
  string avatar = 4;             // 角色头像（Base64编码或URL）
  string description = 5;        // 角色描述，包含性格、背景等设定
  string first_message = 8;      // 角色开场白，对话开始时AI的第一条消息
  string example_dialogue = 9;   // 示例对话，展示角色的对话风格
  string creator_notes = 10;     // 创作者备注，角色卡的使用说明
  int32 world_info_id = 12;      // 关联的世界书ID，提供角色相关的背景知识
  int64 version = 13;            // 乐观锁版本号，用于并发控制
  int64 created_at = 14;         // 创建时间（Unix时间戳）
  int64 updated_at = 15;         // 最后更新时间（Unix时间戳）
  WorldInfo world_info = 16;     // 关联的世界书详情（可选加载）
}

// ================================
// 聊天相关消息
// ================================

// ChatSession 聊天会话，记录与某个角色的对话
message ChatSession {
  int32 id = 1;                    // 会话唯一标识ID
  int32 user_id = 2;               // 所属用户ID
  int32 character_id = 3;          // 关联的角色卡ID
  string name = 4;                 // 会话名称（可选）
  int64 version = 5;               // 乐观锁版本号，用于并发控制
  int64 created_at = 6;            // 创建时间（Unix时间戳）
  int64 updated_at = 7;            // 最后更新时间（Unix时间戳）
  Character character = 8;         // 关联的角色卡详情（可选加载）
  repeated Message messages = 9;   // 会话中的消息列表（可选加载）
}

// Message 聊天消息
message Message {
  int32 id = 1;                        // 消息唯一标识ID
  int32 session_id = 2;                // 所属会话ID
  Role role = 3;                       // 消息角色（用户/助手/系统）
  int32 active_swipe_index = 4;        // 当前激活的swipe索引
  int32 sort_order = 5;                // 消息排序序号，用于确定显示顺序
  int64 created_at = 6;                // 创建时间（Unix时间戳）
  int64 updated_at = 7;                // 最后更新时间（Unix时间戳）
  repeated MessageSwipe swipes = 8;    // 消息内容列表（支持多个候选回复）
}

// MessageSwipe 消息内容变体，支持同一消息的多个候选回复
message MessageSwipe {
  int32 id = 1;          // Swipe唯一标识ID
  int32 message_id = 2;  // 所属消息ID
  string content = 3;    // 消息文本内容
  int32 sort_order = 4;  // 排序序号
  int64 created_at = 5;  // 创建时间（Unix时间戳）
}

// ================================
// 预设相关消息
// ================================

// Preset 预设配置，定义AI生成参数和提示词模板
message Preset {
  int32 id = 1;                              // 预设唯一标识ID
  int32 user_id = 2;                         // 所属用户ID
  string name = 3;                           // 预设名称
  float temperature = 4;                     // 温度参数，控制输出随机性（0.0-2.0）
  float top_p = 5;                           // Top-P采样参数，核采样概率阈值（0.0-1.0）
  int32 top_k = 6;                           // Top-K采样参数，限制候选词数量
  int32 max_tokens = 7;                      // 最大生成令牌数，限制回复长度
  float frequency_penalty = 8;               // 频率惩罚，降低重复词出现概率（-2.0-2.0）
  float presence_penalty = 9;                // 存在惩罚，鼓励谈论新话题（-2.0-2.0）
  int64 version = 10;                        // 乐观锁版本号
  int64 created_at = 11;                     // 创建时间（Unix时间戳）
  int64 updated_at = 12;                     // 最后更新时间（Unix时间戳）
  int32 candidate_count = 15;                // 候选回复数量，一次生成多少个备选回复
  repeated PromptItem prompt_items = 13;     // 提示项列表（可选加载）
  repeated RegexRule regex_rules = 14;       // 正则规则列表（可选加载）
}

// PromptItem 提示项，组成发送给AI的提示词
message PromptItem {
  int32 id = 1;                              // 提示项唯一标识ID
  int32 preset_id = 2;                       // 所属预设ID
  string identifier = 3;                     // 唯一标识符，用于程序识别
  string name = 4;                           // 显示名称
  string content = 5;                        // 提示词内容
  Role role = 6;                             // 消息角色类型
  bool is_enabled = 7;                       // 是否启用
  InjectionPosition injection_position = 8; // 注入位置类型
  int32 injection_depth = 9;                 // 注入深度，绝对位置时的插入深度
  bool forbid_overrides = 10;                // 禁止覆盖，是否允许被其他设置覆盖
  int32 sort_order = 11;                     // 排序序号
  int64 created_at = 12;                     // 创建时间（Unix时间戳）
  int64 updated_at = 13;                     // 最后更新时间（Unix时间戳）
}

// RegexAffectFlags 正则规则作用范围标志
message RegexAffectFlags {
  bool user_input = 1;    // 是否作用于用户输入
  bool ai_output = 2;     // 是否作用于AI输出
  bool slash_command = 3; // 是否作用于斜杠命令
  bool world_info = 4;    // 是否作用于世界书内容
  bool prompt = 5;        // 是否作用于提示词
}

// RegexRule 正则替换规则，用于文本预处理和后处理
message RegexRule {
  int32 id = 1;                      // 规则唯一标识ID
  int32 preset_id = 2;               // 关联的预设ID（0表示全局规则）
  int32 character_id = 15;           // 关联的角色ID（0表示非角色范围规则）
  string name = 3;                   // 规则名称
  string find_pattern = 4;           // 查找模式（正则表达式）
  string replace_pattern = 5;        // 替换模式
  bool is_enabled = 6;               // 是否启用
  bool run_on_edit = 7;              // 编辑消息时是否运行
  bool substitute_regex = 8;         // 是否使用正则替换（否则为字面量替换）
  int32 min_depth = 9;               // 最小作用深度
  int32 max_depth = 10;              // 最大作用深度
  RegexAffectFlags affect_flags = 11; // 作用范围标志
  int32 sort_order = 12;             // 排序序号，决定规则执行顺序
  int64 created_at = 13;             // 创建时间（Unix时间戳）
  int64 updated_at = 14;             // 最后更新时间（Unix时间戳）
}

// ================================
// 世界书相关消息
// ================================

// WorldInfo 世界书，存储角色相关的背景知识
message WorldInfo {
  int32 id = 1;                          // 世界书唯一标识ID
  int32 user_id = 2;                     // 所属用户ID
  string name = 3;                       // 世界书名称
  string description = 4;                // 世界书描述
  bool is_global = 5;                    // 是否为全局世界书，全局世界书对所有角色生效
  int64 created_at = 6;                  // 创建时间（Unix时间戳）
  int64 updated_at = 7;                  // 最后更新时间（Unix时间戳）
  repeated WorldInfoEntry entries = 8;   // 世界书条目列表（可选加载）
}

// WorldInfoEntry 世界书条目，单条背景知识
message WorldInfoEntry {
  int32 id = 1;               // 条目唯一标识ID
  int32 world_info_id = 2;    // 所属世界书ID
  string uid = 3;             // 条目唯一标识符（用于导入导出）
  string keys_list = 4;       // 主关键词列表，逗号分隔，匹配时触发条目
  string secondary_keys = 5;  // 次要关键词列表，与主关键词配合使用
  string content = 6;         // 条目内容，注入到提示词中的文本
  string comment = 7;         // 条目备注，仅用于管理不会注入
  bool is_enabled = 8;        // 是否启用
  bool constant = 9;          // 是否常驻，常驻条目始终注入不需要关键词匹配
  bool selective = 10;        // 选择性匹配，需同时匹配主关键词和次要关键词
  int32 insertion_order = 11; // 插入优先级，数值越小优先级越高
  EntryPosition position = 12; // 插入位置类型
  int32 depth = 13;           // 插入深度，AtDepth位置时的深度值
  int32 sort_order = 14;      // 排序序号
  int64 created_at = 15;      // 创建时间（Unix时间戳）
  int64 updated_at = 16;      // 最后更新时间（Unix时间戳）
}

// ================================
// API配置相关
// ================================

// APIConfig API连接配置
message APIConfig {
  int32 id = 1;            // 配置唯一标识ID
  int32 user_id = 2;       // 所属用户ID
  string name = 3;         // 配置名称
  APIProvider provider = 4; // API服务提供商
  string api_key = 5;      // API密钥（创建/更新时使用，查询时不返回）
  string base_url = 6;     // API基础URL（用于代理或自定义端点）
  string model = 7;        // 使用的模型名称
  bool is_active = 8;      // 是否为当前激活的配置
  int64 created_at = 9;    // 创建时间（Unix时间戳）
  int64 updated_at = 10;   // 最后更新时间（Unix时间戳）
}

// ================================
// 认证
// ================================

// 注册请求
message RegisterRequest {
  string username = 1;
  string password = 2;
}

// 注册响应
message RegisterResponse {
  SysUser user = 1;
  string token = 2;
}

// 登录请求
message LoginRequest {
  string username = 1;
  string password = 2;
}

// 登录响应
message LoginResponse {
  SysUser user = 1;
  string token = 2;
}

// 获取当前用户请求
message GetCurrentUserRequest {}

// 获取当前用户响应
message GetCurrentUserResponse {
  SysUser user = 1;
}

// 修改密码请求
message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

// 修改密码响应
message ChangePasswordResponse {}

// ================================
// 用户服务（包含认证、人设、用户设置和API配置的管理）
// ================================

// 获取人设列表请求
message ListPersonasRequest {}

// 获取人设列表响应
message ListPersonasResponse {
  repeated Persona personas = 1;
}

// 获取单个人设请求
message GetPersonaRequest {
  int32 id = 1;
}

// 获取单个人设响应
message GetPersonaResponse {
  Persona persona = 1;
}

// 创建人设请求
message CreatePersonaRequest {
  string name = 1;
  optional string avatar = 2;
  optional string description = 3;
}

// 创建人设响应
message CreatePersonaResponse {
  Persona persona = 1;
}

// 更新人设请求
message UpdatePersonaRequest {
  int32 id = 1;
  string name = 2;
  optional string avatar = 3;
  optional string description = 4;
}

// 更新人设响应
message UpdatePersonaResponse {
  Persona persona = 1;
}

// 删除人设请求
message DeletePersonaRequest {
  int32 id = 1;
}

// 删除人设响应
message DeletePersonaResponse {}

// 设置活跃人设请求
message SetActivePersonaRequest {
  int32 persona_id = 1;
}

// 设置活跃人设响应
message SetActivePersonaResponse {}

// ================================
// 用户设置
// ================================

// 获取用户设置请求
message GetUserSettingRequest {}

// 获取用户设置响应
message GetUserSettingResponse {
  UserSetting setting = 1;
}

// 更新用户设置请求
message UpdateUserSettingRequest {
  Theme theme = 1;
  string language = 2;
  bool send_on_enter = 3;
  bool show_timestamps = 4;
}

// 更新用户设置响应
message UpdateUserSettingResponse {
  UserSetting setting = 1;
}

// ================================
// API配置
// ================================

// 获取API配置列表请求
message ListAPIConfigsRequest {}

// 获取API配置列表响应
message ListAPIConfigsResponse {
  repeated APIConfig configs = 1;
}

// 获取单个API配置请求
message GetAPIConfigRequest {
  int32 id = 1;
}

// 获取单个API配置响应
message GetAPIConfigResponse {
  APIConfig config = 1;
}

// 创建API配置请求
message CreateAPIConfigRequest {
  string name = 1;
  APIProvider provider = 2;
  string api_key = 3;
  optional string base_url = 4;
  optional string model = 5;
}

// 创建API配置响应
message CreateAPIConfigResponse {
  APIConfig config = 1;
}

// 更新API配置请求
message UpdateAPIConfigRequest {
  int32 id = 1;
  string name = 2;
  APIProvider provider = 3;
  optional string api_key = 4;  // 可选，不传则不更新
  optional string base_url = 5;
  optional string model = 6;
}

// 更新API配置响应
message UpdateAPIConfigResponse {
  APIConfig config = 1;
}

// 删除API配置请求
message DeleteAPIConfigRequest {
  int32 id = 1;
}

// 删除API配置响应
message DeleteAPIConfigResponse {}

// 设置活跃API配置请求
message SetActiveAPIConfigRequest {
  int32 config_id = 1;
}

// 设置活跃API配置响应
message SetActiveAPIConfigResponse {}

// 测试API配置请求
message TestAPIConfigRequest {
  int32 id = 1;
}

// 测试API配置响应
message TestAPIConfigResponse {
  bool success = 1;
  optional string error_message = 2;
  optional string model_info = 3;  // 返回的模型信息
}

// ================================
// 公共配置（无需认证）
// ================================

// 获取公共配置请求
message GetPublicConfigRequest {}

// 获取公共配置响应
message GetPublicConfigResponse {
  bool skip_auth = 1;  // 是否跳过认证
}

// 用户服务（包含认证、人设、用户设置和API配置的管理）
service UserService {
  // 获取公共配置（无需认证）
  rpc GetPublicConfig(GetPublicConfigRequest) returns (GetPublicConfigResponse);
  // 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // 获取当前用户信息
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  // 修改密码
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // 获取人设列表
  rpc ListPersonas(ListPersonasRequest) returns (ListPersonasResponse);
  // 获取单个人设
  rpc GetPersona(GetPersonaRequest) returns (GetPersonaResponse);
  // 创建人设
  rpc CreatePersona(CreatePersonaRequest) returns (CreatePersonaResponse);
  // 更新人设
  rpc UpdatePersona(UpdatePersonaRequest) returns (UpdatePersonaResponse);
  // 删除人设
  rpc DeletePersona(DeletePersonaRequest) returns (DeletePersonaResponse);
  // 设置活跃人设
  rpc SetActivePersona(SetActivePersonaRequest) returns (SetActivePersonaResponse);

  // 获取用户设置
  rpc GetUserSetting(GetUserSettingRequest) returns (GetUserSettingResponse);
  // 更新用户设置
  rpc UpdateUserSetting(UpdateUserSettingRequest) returns (UpdateUserSettingResponse);

  // 获取API配置列表
  rpc ListAPIConfigs(ListAPIConfigsRequest) returns (ListAPIConfigsResponse);
  // 获取单个API配置
  rpc GetAPIConfig(GetAPIConfigRequest) returns (GetAPIConfigResponse);
  // 创建API配置
  rpc CreateAPIConfig(CreateAPIConfigRequest) returns (CreateAPIConfigResponse);
  // 更新API配置
  rpc UpdateAPIConfig(UpdateAPIConfigRequest) returns (UpdateAPIConfigResponse);
  // 删除API配置
  rpc DeleteAPIConfig(DeleteAPIConfigRequest) returns (DeleteAPIConfigResponse);
  // 设置活跃API配置
  rpc SetActiveAPIConfig(SetActiveAPIConfigRequest) returns (SetActiveAPIConfigResponse);
  // 测试API配置连接
  rpc TestAPIConfig(TestAPIConfigRequest) returns (TestAPIConfigResponse);
}

// ================================
// 角色卡服务
// ================================

// 获取角色卡列表请求
message ListCharactersRequest {
  optional int32 page = 1;
  optional int32 page_size = 2;
}

// 获取角色卡列表响应
message ListCharactersResponse {
  repeated Character characters = 1;
  int32 total = 2;
}

// 获取单个角色卡请求
message GetCharacterRequest {
  int32 id = 1;
}

// 获取单个角色卡响应
message GetCharacterResponse {
  Character character = 1;
}

// 创建角色卡请求
message CreateCharacterRequest {
  string name = 1;
  optional string avatar = 2;
  optional string description = 3;
  optional string personality = 4;
  optional string scenario = 5;
  optional string first_message = 6;
  optional string example_dialogue = 7;
  optional string creator_notes = 8;
  optional string system_prompt = 9;
  optional int32 world_info_id = 10;
}

// 创建角色卡响应
message CreateCharacterResponse {
  Character character = 1;
}

// 更新角色卡请求
message UpdateCharacterRequest {
  int32 id = 1;
  string name = 2;
  optional string avatar = 3;
  optional string description = 4;
  optional string personality = 5;
  optional string scenario = 6;
  optional string first_message = 7;
  optional string example_dialogue = 8;
  optional string creator_notes = 9;
  optional string system_prompt = 10;
  optional int32 world_info_id = 11;
  int64 version = 12;  // 乐观锁版本号
}

// 更新角色卡响应
message UpdateCharacterResponse {
  Character character = 1;
}

// 删除角色卡请求
message DeleteCharacterRequest {
  int32 id = 1;
}

// 删除角色卡响应
message DeleteCharacterResponse {}

// 导入角色卡请求
message ImportCharacterRequest {
  bytes file_content = 1;  // PNG图片或JSON文件内容
  string file_name = 2;    // 文件名，用于判断格式
}

// 导入角色卡响应
message ImportCharacterResponse {
  Character character = 1;
}

// 导出角色卡请求
message ExportCharacterRequest {
  int32 id = 1;
  string format = 2;  // "png" 或 "json"
}

// 导出角色卡响应
message ExportCharacterResponse {
  bytes file_content = 1;
  string file_name = 2;
}

// 恢复角色卡世界书请求
message RestoreCharacterWorldInfoRequest {
  int32 character_id = 1;
}

// 恢复角色卡世界书响应
message RestoreCharacterWorldInfoResponse {
  WorldInfo world_info = 1;
}

// 角色卡服务
service CharacterService {
  // 获取角色卡列表
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse);
  // 获取单个角色卡
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterResponse);
  // 创建角色卡
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  // 更新角色卡
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);
  // 删除角色卡
  rpc DeleteCharacter(DeleteCharacterRequest) returns (DeleteCharacterResponse);
  // 导入角色卡（支持SillyTavern格式）
  rpc ImportCharacter(ImportCharacterRequest) returns (ImportCharacterResponse);
  // 导出角色卡
  rpc ExportCharacter(ExportCharacterRequest) returns (ExportCharacterResponse);
  // 恢复角色卡的世界书（从备份恢复）
  rpc RestoreCharacterWorldInfo(RestoreCharacterWorldInfoRequest) returns (RestoreCharacterWorldInfoResponse);
}

// ================================
// 聊天服务
// ================================

// 获取会话列表请求
message ListChatSessionsRequest {
  optional int32 character_id = 1;  // 可选，按角色筛选
  optional int32 page = 2;
  optional int32 page_size = 3;
}

// 获取会话列表响应
message ListChatSessionsResponse {
  repeated ChatSession sessions = 1;
  int32 total = 2;
}

// 获取单个会话请求
message GetChatSessionRequest {
  int32 id = 1;
  bool include_messages = 2;  // 是否包含消息
}

// 获取单个会话响应
message GetChatSessionResponse {
  ChatSession session = 1;
}

// 创建会话请求
message CreateChatSessionRequest {
  int32 character_id = 1;
  optional string name = 2;
}

// 创建会话响应
message CreateChatSessionResponse {
  ChatSession session = 1;
}

// 更新会话请求
message UpdateChatSessionRequest {
  int32 id = 1;
  optional string name = 2;
  int64 version = 3;  // 乐观锁版本号
}

// 更新会话响应
message UpdateChatSessionResponse {
  ChatSession session = 1;
}

// 删除会话请求
message DeleteChatSessionRequest {
  int32 id = 1;
}

// 删除会话响应
message DeleteChatSessionResponse {}

// 发送消息请求
message SendMessageRequest {
  int32 session_id = 1;
  string content = 2;
}

// 发送消息响应（流式）
message SendMessageResponse {
  int32 index = 1; // 多个候选回复时，候选回复的下标
  string content = 2;
  bool is_complete = 3;           // 是否完成
}

// 重新生成消息请求
message RegenerateMessageRequest {
  int32 message_id = 1;  // 要重新生成的AI消息ID
}

// 重新生成消息响应（流式）
message RegenerateMessageResponse {
  MessageSwipe new_swipe = 1;  // 新的swipe
  string content_delta = 2;    // 内容增量
  bool is_complete = 3;        // 是否完成
}

// 编辑消息请求
message EditMessageRequest {
  int32 message_id = 1;
  int32 swipe_id = 2;     // 要编辑的swipe ID
  string content = 3;      // 新内容
}

// 编辑消息响应
message EditMessageResponse {
  MessageSwipe swipe = 1;
}

// 删除消息请求
message DeleteMessageRequest {
  int32 message_id = 1;
}

// 删除消息响应
message DeleteMessageResponse {}

// 切换Swipe请求
message SwitchSwipeRequest {
  int32 message_id = 1;
  int32 swipe_index = 2;
}

// 切换Swipe响应
message SwitchSwipeResponse {
  Message message = 1;
}

// 聊天服务
service ChatService {
  // 获取会话列表
  rpc ListChatSessions(ListChatSessionsRequest) returns (ListChatSessionsResponse);
  // 获取单个会话
  rpc GetChatSession(GetChatSessionRequest) returns (GetChatSessionResponse);
  // 创建会话
  rpc CreateChatSession(CreateChatSessionRequest) returns (CreateChatSessionResponse);
  // 更新会话
  rpc UpdateChatSession(UpdateChatSessionRequest) returns (UpdateChatSessionResponse);
  // 删除会话
  rpc DeleteChatSession(DeleteChatSessionRequest) returns (DeleteChatSessionResponse);
  // 发送消息（流式响应）
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse);
  // 重新生成消息（流式响应）
  rpc RegenerateMessage(RegenerateMessageRequest) returns (stream RegenerateMessageResponse);
  // 编辑消息
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  // 删除消息
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  // 切换Swipe
  rpc SwitchSwipe(SwitchSwipeRequest) returns (SwitchSwipeResponse);
}

// ================================
// 预设服务
// ================================

// 获取预设列表请求
// 注意：此接口不加载关联的PromptItems和RegexRules数据，仅返回预设基本信息
message ListPresetsRequest {
  int32 page = 1; // 页码，从1开始，默认为1
  int32 page_size = 2; // 每页数量，默认为20，最大100
}

// 获取预设列表响应
// 注意：返回的预设不包含关联的PromptItems和RegexRules数据
message ListPresetsResponse {
  repeated Preset presets = 1; // 预设列表
  int64 total = 2; // 总数
  int32 page = 3; // 当前页码
  int32 page_size = 4; // 每页数量
}

// 获取单个预设请求
message GetPresetRequest {
  int32 id = 1;
}

// 获取单个预设响应
message GetPresetResponse {
  Preset preset = 1;
}

// 创建预设请求
message CreatePresetRequest {
  string name = 1;
  float temperature = 2;
  float top_p = 3;
  int32 top_k = 4;
  int32 max_tokens = 5;
  float frequency_penalty = 6;
  float presence_penalty = 7;
  repeated CreatePromptItemRequest prompt_items = 8;
  repeated CreateRegexRuleRequest regex_rules = 9;
}

// 创建提示项请求（嵌套）
message CreatePromptItemRequest {
  string identifier = 1;
  string name = 2;
  optional string content = 3;
  Role role = 4;
  bool is_enabled = 5;
  InjectionPosition injection_position = 6;
  int32 injection_depth = 7;
  bool forbid_overrides = 8;
  int32 sort_order = 9;
}

// 创建正则规则请求（嵌套）
message CreateRegexRuleRequest {
  string name = 1;
  string find_pattern = 2;
  optional string replace_pattern = 3;
  bool is_enabled = 4;
  bool run_on_edit = 5;
  bool substitute_regex = 6;
  optional int32 min_depth = 7;
  optional int32 max_depth = 8;
  RegexAffectFlags affect_flags = 9;
  int32 sort_order = 10;
}

// 创建预设响应
message CreatePresetResponse {
  Preset preset = 1;
}

// 更新预设请求
message UpdatePresetRequest {
  int32 id = 1;
  string name = 2;
  float temperature = 3;
  float top_p = 4;
  int32 top_k = 5;
  int32 max_tokens = 6;
  float frequency_penalty = 7;
  float presence_penalty = 8;
  int64 version = 9;  // 乐观锁版本号
}

// 更新预设响应
message UpdatePresetResponse {
  Preset preset = 1;
}

// 删除预设请求
message DeletePresetRequest {
  int32 id = 1;
}

// 删除预设响应
message DeletePresetResponse {}

// 设置活跃预设请求
message SetActivePresetRequest {
  int32 preset_id = 1;
}

// 设置活跃预设响应
message SetActivePresetResponse {}

// 导入预设请求
message ImportPresetRequest {
  bytes file_content = 1;  // JSON文件内容
  string file_name = 2;
}

// 导入预设响应
message ImportPresetResponse {
  Preset preset = 1;
}

// 导出预设请求
message ExportPresetRequest {
  int32 id = 1;
}

// 导出预设响应
message ExportPresetResponse {
  bytes file_content = 1;
  string file_name = 2;
}

// 获取预设的提示项列表请求
message ListPromptItemsRequest {
  int32 preset_id = 1;
}

// 获取预设的提示项列表响应
message ListPromptItemsResponse {
  repeated PromptItem items = 1;
}

// 创建提示项请求
message AddPromptItemRequest {
  int32 preset_id = 1;
  string identifier = 2;
  string name = 3;
  optional string content = 4;
  Role role = 5;
  bool is_enabled = 6;
  InjectionPosition injection_position = 7;
  int32 injection_depth = 8;
  bool forbid_overrides = 9;
  int32 sort_order = 10;
}

// 创建提示项响应
message AddPromptItemResponse {
  PromptItem item = 1;
}

// 更新提示项请求
message UpdatePromptItemRequest {
  int32 id = 1;
  string identifier = 2;
  string name = 3;
  optional string content = 4;
  Role role = 5;
  bool is_enabled = 6;
  InjectionPosition injection_position = 7;
  int32 injection_depth = 8;
  bool forbid_overrides = 9;
  int32 sort_order = 10;
}

// 更新提示项响应
message UpdatePromptItemResponse {
  PromptItem item = 1;
}

// 删除提示项请求
message DeletePromptItemRequest {
  int32 id = 1;
}

// 删除提示项响应
message DeletePromptItemResponse {}

// 批量更新提示项排序请求
message UpdatePromptItemsOrderRequest {
  int32 preset_id = 1;
  repeated int32 item_ids = 2;  // 按新顺序排列的ID列表
}

// 批量更新提示项排序响应
message UpdatePromptItemsOrderResponse {}

// 预设服务（包含预设和提示项的管理）
service PresetService {
  // 获取预设列表
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  // 获取单个预设
  rpc GetPreset(GetPresetRequest) returns (GetPresetResponse);
  // 创建预设
  rpc CreatePreset(CreatePresetRequest) returns (CreatePresetResponse);
  // 更新预设
  rpc UpdatePreset(UpdatePresetRequest) returns (UpdatePresetResponse);
  // 删除预设
  rpc DeletePreset(DeletePresetRequest) returns (DeletePresetResponse);
  // 设置活跃预设
  rpc SetActivePreset(SetActivePresetRequest) returns (SetActivePresetResponse);
  // 导入预设（支持SillyTavern格式）
  rpc ImportPreset(ImportPresetRequest) returns (ImportPresetResponse);
  // 导出预设
  rpc ExportPreset(ExportPresetRequest) returns (ExportPresetResponse);

  // 获取预设的提示项列表
  rpc ListPromptItems(ListPromptItemsRequest) returns (ListPromptItemsResponse);
  // 添加提示项
  rpc AddPromptItem(AddPromptItemRequest) returns (AddPromptItemResponse);
  // 更新提示项
  rpc UpdatePromptItem(UpdatePromptItemRequest) returns (UpdatePromptItemResponse);
  // 删除提示项
  rpc DeletePromptItem(DeletePromptItemRequest) returns (DeletePromptItemResponse);
  // 批量更新提示项排序
  rpc UpdatePromptItemsOrder(UpdatePromptItemsOrderRequest) returns (UpdatePromptItemsOrderResponse);
}

// ================================
// 正则规则服务
// ================================

// 获取预设的正则规则列表请求
message ListRegexRulesRequest {
  int32 preset_id = 1;
}

// 获取预设的正则规则列表响应
message ListRegexRulesResponse {
  repeated RegexRule rules = 1;
}

// 添加正则规则请求
message AddRegexRuleRequest {
  int32 preset_id = 1;
  string name = 2;
  string find_pattern = 3;
  optional string replace_pattern = 4;
  bool is_enabled = 5;
  bool run_on_edit = 6;
  bool substitute_regex = 7;
  optional int32 min_depth = 8;
  optional int32 max_depth = 9;
  RegexAffectFlags affect_flags = 10;
  int32 sort_order = 11;
}

// 添加正则规则响应
message AddRegexRuleResponse {
  RegexRule rule = 1;
}

// 更新正则规则请求
message UpdateRegexRuleRequest {
  int32 id = 1;
  string name = 2;
  string find_pattern = 3;
  optional string replace_pattern = 4;
  bool is_enabled = 5;
  bool run_on_edit = 6;
  bool substitute_regex = 7;
  optional int32 min_depth = 8;
  optional int32 max_depth = 9;
  RegexAffectFlags affect_flags = 10;
  int32 sort_order = 11;
}

// 更新正则规则响应
message UpdateRegexRuleResponse {
  RegexRule rule = 1;
}

// 删除正则规则请求
message DeleteRegexRuleRequest {
  int32 id = 1;
}

// 删除正则规则响应
message DeleteRegexRuleResponse {}

// 批量更新正则规则排序请求
message UpdateRegexRulesOrderRequest {
  int32 preset_id = 1;
  repeated int32 rule_ids = 2;  // 按新顺序排列的ID列表
}

// 批量更新正则规则排序响应
message UpdateRegexRulesOrderResponse {}

// 导入正则规则请求
// 导入的都是全局正则（preset_id = 0）
message ImportRegexRulesRequest {
  bytes file_content = 1;  // JSON文件内容
  string file_name = 2;
}

// 导入正则规则响应
message ImportRegexRulesResponse {}

// 导出正则规则请求
message ExportRegexRulesRequest {
  int32 preset_id = 1;
}

// 导出正则规则响应
message ExportRegexRulesResponse {
  bytes file_content = 1;
  string file_name = 2;
}

// 正则规则服务
service RegexRuleService {
  // 获取预设的正则规则列表
  rpc ListRegexRules(ListRegexRulesRequest) returns (ListRegexRulesResponse);
  // 添加正则规则
  rpc AddRegexRule(AddRegexRuleRequest) returns (AddRegexRuleResponse);
  // 更新正则规则
  rpc UpdateRegexRule(UpdateRegexRuleRequest) returns (UpdateRegexRuleResponse);
  // 删除正则规则
  rpc DeleteRegexRule(DeleteRegexRuleRequest) returns (DeleteRegexRuleResponse);
  // 批量更新正则规则排序
  rpc UpdateRegexRulesOrder(UpdateRegexRulesOrderRequest) returns (UpdateRegexRulesOrderResponse);
  // 导入正则规则
  rpc ImportRegexRules(ImportRegexRulesRequest) returns (ImportRegexRulesResponse);
  // 导出正则规则
  rpc ExportRegexRules(ExportRegexRulesRequest) returns (ExportRegexRulesResponse);
}

