syntax = "proto3";

package muse;

import "muse/common.proto";

option go_package = "github.com/ling/muse/gen/muse;muse";

// RegexAffectFlags 正则规则作用范围标志
message RegexAffectFlags {
  bool user_input = 1;    // 是否作用于用户输入
  bool ai_output = 2;     // 是否作用于AI输出
  bool slash_command = 3; // 是否作用于斜杠命令
  bool world_info = 4;    // 是否作用于世界书内容
  bool prompt = 5;        // 是否作用于提示词
}

// RegexRule 正则替换规则，用于文本预处理和后处理
message RegexRule {
  int32 id = 1;                      // 规则唯一标识ID
  int32 preset_id = 2;               // 关联的预设ID（0表示全局规则）
  int32 character_id = 15;           // 关联的角色ID（0表示非角色范围规则）
  string name = 3;                   // 规则名称
  string find_pattern = 4;           // 查找模式（正则表达式）
  string replace_pattern = 5;        // 替换模式
  bool is_enabled = 6;               // 是否启用
  bool run_on_edit = 7;              // 编辑消息时是否运行
  bool substitute_regex = 8;         // 是否使用正则替换（否则为字面量替换）
  int32 min_depth = 9;               // 最小作用深度
  int32 max_depth = 10;              // 最大作用深度
  RegexAffectFlags affect_flags = 11; // 作用范围标志
  int32 sort_order = 12;             // 排序序号，决定规则执行顺序
  int64 created_at = 13;             // 创建时间（Unix时间戳）
  int64 updated_at = 14;             // 最后更新时间（Unix时间戳）
}

// ================================
// 正则规则服务
// ================================

// 获取正则规则列表请求（全量拉取全局+预设+角色正则）
message ListRegexRulesReq {
  int32 preset_id = 1;     // 预设ID（0表示仅拉取全局正则）
  int32 character_id = 2;  // 角色ID（0表示仅拉取角色正则）
}

// 获取正则规则列表响应（全量，不分页）
message ListRegexRulesRsp {
  repeated RegexRule rules = 1;
}

// 添加正则规则请求
message AddRegexRuleReq {
  int32 preset_id = 1;
  int32 character_id = 16;
  string name = 2;
  string find_pattern = 3;
  optional string replace_pattern = 4;
  bool is_enabled = 5;
  bool run_on_edit = 6;
  bool substitute_regex = 7;
  optional int32 min_depth = 8;
  optional int32 max_depth = 9;
  RegexAffectFlags affect_flags = 10;
  int32 sort_order = 11;
}

// 添加正则规则响应
message AddRegexRuleRsp {
  RegexRule rule = 1;
}

// 更新正则规则请求
message UpdateRegexRuleReq {
  int32 id = 1;
  string name = 2;
  string find_pattern = 3;
  optional string replace_pattern = 4;
  bool is_enabled = 5;
  bool run_on_edit = 6;
  bool substitute_regex = 7;
  optional int32 min_depth = 8;
  optional int32 max_depth = 9;
  RegexAffectFlags affect_flags = 10;
  int32 sort_order = 11;
}

// 更新正则规则响应
message UpdateRegexRuleRsp {
  RegexRule rule = 1;
}

// 删除正则规则请求
message DeleteRegexRuleReq {
  int32 id = 1;
}

// 删除正则规则响应
message DeleteRegexRuleRsp {}

// 批量更新正则规则排序请求
message UpdateRegexRulesOrderReq {
  int32 preset_id = 1;
  repeated int32 rule_ids = 2;  // 按新顺序排列的ID列表
}

// 批量更新正则规则排序响应
message UpdateRegexRulesOrderRsp {}

// 导入正则规则请求
// 导入的都是全局正则（preset_id = 0）
message ImportRegexRulesReq {
  bytes file_content = 1;  // JSON文件内容
  string file_name = 2;
}

// 导入正则规则响应
message ImportRegexRulesRsp {}

// 导出正则规则请求
message ExportRegexRulesReq {
  int32 preset_id = 1;
}

// 导出正则规则响应
message ExportRegexRulesRsp {
  bytes file_content = 1;
  string file_name = 2;
}

// 正则规则服务
service RegexRuleService {
  // 获取正则规则列表（全量拉取全局+预设+角色正则）
  rpc ListRegexRules(ListRegexRulesReq) returns (ListRegexRulesRsp);
  // 添加正则规则
  rpc AddRegexRule(AddRegexRuleReq) returns (AddRegexRuleRsp);
  // 更新正则规则
  rpc UpdateRegexRule(UpdateRegexRuleReq) returns (UpdateRegexRuleRsp);
  // 删除正则规则
  rpc DeleteRegexRule(DeleteRegexRuleReq) returns (DeleteRegexRuleRsp);
  // 批量更新正则规则排序
  rpc UpdateRegexRulesOrder(UpdateRegexRulesOrderReq) returns (UpdateRegexRulesOrderRsp);
  // 导入正则规则
  rpc ImportRegexRules(ImportRegexRulesReq) returns (ImportRegexRulesRsp);
  // 导出正则规则
  rpc ExportRegexRules(ExportRegexRulesReq) returns (ExportRegexRulesRsp);
}