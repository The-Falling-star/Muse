syntax = "proto3";

package muse;

import "muse/common.proto";

option go_package = "github.com/ling/muse/gen/muse;muse";

// ================================
// 用户相关消息
// ================================

// SysUser 系统用户信息
message SysUser {
  int32 id = 1;                 // 用户唯一标识ID
  string username = 2;          // 用户名，用于登录
  int32 active_persona_id = 3;  // 当前激活的用户人设ID
  int32 active_preset_id = 4;   // 当前激活的预设ID
  Theme theme = 5;              // 界面主题
  string language = 6;          // 语言设置（如 zh-CN、en-US）
  bool send_on_enter = 7;       // 是否按回车键发送消息
  bool show_timestamps = 8;     // 是否显示消息时间戳
  int64 created_at = 9;         // 创建时间（Unix时间戳）
  int64 updated_at = 10;        // 最后更新时间（Unix时间戳）
  APIProvider provider = 11;    // API服务提供商
  string model = 12;            // 使用的模型名称
  string proxy_url = 13;         // API代理URL（用于代理或自定义端点）
}

// Persona 用户人设，定义用户在对话中的身份
message Persona {
  int32 id = 1;           // 人设唯一标识ID
  int32 user_id = 2;      // 所属用户ID
  string name = 3;        // 人设名称
  string avatar = 4;      // 人设头像（Base64编码或URL）
  string description = 5; // 人设描述，定义用户的角色设定
  int64 created_at = 6;   // 创建时间（Unix时间戳）
  int64 updated_at = 7;   // 最后更新时间（Unix时间戳）
}

// APIConfig API连接配置
message APIConfig {
  int32 id = 1;            // 配置唯一标识ID
  int32 user_id = 2;       // 所属用户ID
  APIProvider provider = 4; // API服务提供商
  string api_key = 5;      // API密钥（创建/更新时使用，查询时不返回）
  bool is_active = 8;      // 是否为当前激活的配置
  int64 created_at = 9;    // 创建时间（Unix时间戳）
  int64 updated_at = 10;   // 最后更新时间（Unix时间戳）
}

// ================================
// 认证
// ================================

// 注册请求
message RegisterReq {
  string username = 1;
  string password = 2;
}

// 注册响应
message RegisterRsp {
  SysUser user = 1;
  string token = 2;
}

// 登录请求
message LoginReq {
  string username = 1;
  string password = 2;
}

// 登录响应
message LoginRsp {
  SysUser user = 1;
  string token = 2;
}

// 获取当前用户请求
message GetCurrentUserReq {}

// 获取当前用户响应
message GetCurrentUserRsp {
  SysUser user = 1;
}

// 修改密码请求
message ChangePasswordReq {
  string old_password = 1;
  string new_password = 2;
}

// 修改密码响应
message ChangePasswordRsp {}

// ================================
// 用户服务（包含认证、人设、用户设置和API配置的管理）
// ================================

// 获取人设列表请求
message ListPersonasReq {}

// 获取人设列表响应
message ListPersonasRsp {
  repeated Persona personas = 1;
}

// 获取单个人设请求
message GetPersonaReq {
  int32 id = 1;
}

// 获取单个人设响应
message GetPersonaRsp {
  Persona persona = 1;
}

// 创建人设请求
message CreatePersonaReq {
  string name = 1;
  optional string avatar = 2;
  optional string description = 3;
}

// 创建人设响应
message CreatePersonaRsp {
  Persona persona = 1;
}

// 更新人设请求
message UpdatePersonaReq {
  int32 id = 1;
  string name = 2;
  optional string avatar = 3;
  optional string description = 4;
}

// 更新人设响应
message UpdatePersonaRsp {
  Persona persona = 1;
}

// 删除人设请求
message DeletePersonaReq {
  int32 id = 1;
}

// 删除人设响应
message DeletePersonaRsp {}

// 设置活跃人设请求
message SetActivePersonaReq {
  int32 persona_id = 1;
}

// 设置活跃人设响应
message SetActivePersonaRsp {}

// ================================
// 用户设置
// ================================

// 获取用户设置请求
message GetUserInfoReq {}

// 获取用户信息响应
message GetUserInfoRsp {
  SysUser user = 1;
}

// 更新用户信息请求
message UpdateUserInfoReq {
  optional Theme theme = 1;
  optional string language = 2;
  optional APIProvider provider = 5;
  optional string model = 6;
  optional string proxy_url = 7;
}

// 更新用户信息响应
message UpdateUserInfoRsp {}

// ================================
// API配置
// ================================

// 获取API配置列表请求
message ListAPIConfigsReq {
  APIProvider provider = 1;
}

// 获取API配置列表响应
message ListAPIConfigsRsp {
  repeated APIConfig configs = 1;
}

// 创建API配置请求
message CreateAPIConfigReq {
  APIProvider provider = 2;
  string api_key = 3;
}

// 创建API配置响应
message CreateAPIConfigRsp {
  int32 config_id = 1;
}

// 更新API配置请求
message UpdateAPIConfigReq {
  int32 id = 1;
  APIProvider provider = 3;
  optional string api_key = 4;  // 可选，不传则不更新
}

// 更新API配置响应
message UpdateAPIConfigRsp {}

// 删除API配置请求
message DeleteAPIConfigReq {
  int32 id = 1;
}

// 删除API配置响应
message DeleteAPIConfigRsp {}

// 设置活跃API配置请求
message SetActiveAPIConfigReq {
  int32 config_id = 1;
}

// 设置活跃API配置响应
message SetActiveAPIConfigRsp {}

// 测试API配置请求
message TestAPIConfigReq {
  int32 id = 1;
}

// 测试API配置响应
message TestAPIConfigRsp {
  bool success = 1;
  optional string error_message = 2;
  optional string model_info = 3;  // 返回的模型信息
}

// 用户服务（包含认证、人设、用户设置和API配置的管理）
service UserService {
  // 用户注册
  rpc Register(RegisterReq) returns (RegisterRsp);
  // 用户登录
  rpc Login(LoginReq) returns (LoginRsp);
  // 获取当前用户信息
  rpc GetCurrentUser(GetCurrentUserReq) returns (GetCurrentUserRsp);
  // 修改密码
  rpc ChangePassword(ChangePasswordReq) returns (ChangePasswordRsp);

  // 获取人设列表
  rpc ListPersonas(ListPersonasReq) returns (ListPersonasRsp);
  // 获取单个人设
  rpc GetPersona(GetPersonaReq) returns (GetPersonaRsp);
  // 创建人设
  rpc CreatePersona(CreatePersonaReq) returns (CreatePersonaRsp);
  // 更新人设
  rpc UpdatePersona(UpdatePersonaReq) returns (UpdatePersonaRsp);
  // 删除人设
  rpc DeletePersona(DeletePersonaReq) returns (DeletePersonaRsp);
  // 设置活跃人设
  rpc SetActivePersona(SetActivePersonaReq) returns (SetActivePersonaRsp);

  // 获取用户信息
  rpc GetUserInfo(GetUserInfoReq) returns (GetUserInfoRsp);
  // 更新用户信息
  rpc UpdateUserInfo(UpdateUserInfoReq) returns (UpdateUserInfoRsp);

  // 获取API配置列表
  rpc ListAPIConfigs(ListAPIConfigsReq) returns (ListAPIConfigsRsp);
  // 创建API配置
  rpc CreateAPIConfig(CreateAPIConfigReq) returns (CreateAPIConfigRsp);
  // 更新API配置
  rpc UpdateAPIConfig(UpdateAPIConfigReq) returns (UpdateAPIConfigRsp);
  // 删除API配置
  rpc DeleteAPIConfig(DeleteAPIConfigReq) returns (DeleteAPIConfigRsp);
  // 设置活跃API配置
  rpc SetActiveAPIConfig(SetActiveAPIConfigReq) returns (SetActiveAPIConfigRsp);
  // 测试API配置连接
  rpc TestAPIConfig(TestAPIConfigReq) returns (TestAPIConfigRsp);
}