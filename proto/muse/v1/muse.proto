syntax = "proto3";

package muse.v1;

option go_package = "github.com/ling/muse/gen/muse/v1;musev1";


// ================================
// 枚举定义
// ================================

// MessageRole 消息角色
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_SYSTEM = 1;
  MESSAGE_ROLE_USER = 2;
  MESSAGE_ROLE_ASSISTANT = 3;
}

// PromptItemRole 提示项角色
enum PromptItemRole {
  PROMPT_ITEM_ROLE_UNSPECIFIED = 0;
  PROMPT_ITEM_ROLE_SYSTEM = 1;
  PROMPT_ITEM_ROLE_USER = 2;
  PROMPT_ITEM_ROLE_ASSISTANT = 3;
}

// InjectionPosition 注入位置
enum InjectionPosition {
  INJECTION_POSITION_UNSPECIFIED = 0;
  INJECTION_POSITION_RELATIVE = 1;
  INJECTION_POSITION_ABSOLUTE = 2;
}

// EntryPosition 世界书条目插入位置
enum EntryPosition {
  ENTRY_POSITION_UNSPECIFIED = 0;
  ENTRY_POSITION_BEFORE_CHAR = 1;
  ENTRY_POSITION_AFTER_CHAR = 2;
  ENTRY_POSITION_BEFORE_EXAMPLE = 3;
  ENTRY_POSITION_AFTER_EXAMPLE = 4;
  ENTRY_POSITION_AT_DEPTH = 5;
}

// APIProvider API提供商
enum APIProvider {
  API_PROVIDER_UNSPECIFIED = 0;
  API_PROVIDER_OPENAI = 1;
  API_PROVIDER_CLAUDE = 2;
  API_PROVIDER_GEMINI = 3;
}

// Theme 主题
enum Theme {
  THEME_AUTO = 0;
  THEME_LIGHT = 1;
  THEME_DARK = 2;
}

// ================================
// 用户相关消息
// ================================

// User 用户信息
message User {
  uint32 id = 1;
  string username = 2;
  optional string email = 3;
  optional uint32 active_persona_id = 4;
  optional uint32 active_preset_id = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

// Persona 用户人设
message Persona {
  uint32 id = 1;
  uint32 user_id = 2;
  string name = 3;
  optional string avatar = 4;
  optional string description = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

// UserSetting 用户设置
message UserSetting {
  uint32 id = 1;
  uint32 user_id = 2;
  Theme theme = 3;
  string language = 4;
  bool send_on_enter = 5;
  bool show_timestamps = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

// ================================
// 角色卡相关消息
// ================================

// Character 角色卡
message Character {
  uint32 id = 1;
  uint32 user_id = 2;
  string name = 3;
  optional string avatar = 4;
  optional string description = 5;
  optional string personality = 6;
  optional string scenario = 7;
  optional string first_message = 8;
  optional string example_dialogue = 9;
  optional string creator_notes = 10;
  optional string system_prompt = 11;
  optional uint32 world_info_id = 12;
  uint32 version = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
  // 关联的世界书（可选加载）
  optional WorldInfo world_info = 16;
}

// ================================
// 聊天相关消息
// ================================

// ChatSession 聊天会话
message ChatSession {
  uint32 id = 1;
  uint32 user_id = 2;
  uint32 character_id = 3;
  optional string name = 4;
  uint32 version = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // 关联数据（可选加载）
  optional Character character = 8;
  repeated Message messages = 9;
}

// Message 消息
message Message {
  uint32 id = 1;
  uint32 session_id = 2;
  MessageRole role = 3;
  int32 active_swipe_index = 4;
  int32 sort_order = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // 消息内容列表
  repeated MessageSwipe swipes = 8;
}

// MessageSwipe 消息内容（单个swipe）
message MessageSwipe {
  uint32 id = 1;
  uint32 message_id = 2;
  string content = 3;
  int32 sort_order = 4;
  int64 created_at = 5;
}

// ================================
// 预设相关消息
// ================================

// Preset 预设
message Preset {
  uint32 id = 1;
  uint32 user_id = 2;
  string name = 3;
  double temperature = 4;
  double top_p = 5;
  int32 top_k = 6;
  int32 max_tokens = 7;
  double frequency_penalty = 8;
  double presence_penalty = 9;
  uint32 version = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  // 关联数据（可选加载）
  repeated PromptItem prompt_items = 13;
  repeated RegexRule regex_rules = 14;
}

// PromptItem 提示项
message PromptItem {
  uint32 id = 1;
  uint32 preset_id = 2;
  string identifier = 3;
  string name = 4;
  optional string content = 5;
  PromptItemRole role = 6;
  bool is_enabled = 7;
  InjectionPosition injection_position = 8;
  int32 injection_depth = 9;
  bool forbid_overrides = 10;
  int32 sort_order = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
}

// RegexRule 正则规则
message RegexRule {
  uint32 id = 1;
  uint32 preset_id = 2;
  string name = 3;
  string find_pattern = 4;
  optional string replace_pattern = 5;
  bool is_enabled = 6;
  bool run_on_edit = 7;
  bool substitute_regex = 8;
  optional int32 min_depth = 9;
  optional int32 max_depth = 10;
  uint32 affect_flags = 11;  // 位掩码
  int32 sort_order = 12;
  int64 created_at = 13;
  int64 updated_at = 14;
}

// ================================
// 世界书相关消息
// ================================

// WorldInfo 世界书
message WorldInfo {
  uint32 id = 1;
  uint32 user_id = 2;
  string name = 3;
  optional string description = 4;
  bool is_global = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
  // 关联数据（可选加载）
  repeated WorldInfoEntry entries = 8;
}

// WorldInfoEntry 世界书条目
message WorldInfoEntry {
  uint32 id = 1;
  uint32 world_info_id = 2;
  optional string uid = 3;
  string keys_list = 4;
  optional string secondary_keys = 5;
  string content = 6;
  optional string comment = 7;
  bool is_enabled = 8;
  bool constant = 9;
  bool selective = 10;
  int32 insertion_order = 11;
  EntryPosition position = 12;
  int32 depth = 13;
  int32 sort_order = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
}

// ================================
// API配置相关消息
// ================================

// APIConfig API配置
message APIConfig {
  uint32 id = 1;
  uint32 user_id = 2;
  string name = 3;
  APIProvider provider = 4;
  string api_key = 5;  // 创建/更新时使用，查询时不返回
  optional string base_url = 6;
  optional string model = 7;
  bool is_active = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

// ================================
// 认证服务
// ================================

// 注册请求
message RegisterRequest {
  string username = 1;
  string password = 2;
  optional string email = 3;
}

// 注册响应
message RegisterResponse {
  User user = 1;
  string token = 2;
}

// 登录请求
message LoginRequest {
  string username = 1;
  string password = 2;
}

// 登录响应
message LoginResponse {
  User user = 1;
  string token = 2;
}

// 获取当前用户请求
message GetCurrentUserRequest {}

// 获取当前用户响应
message GetCurrentUserResponse {
  User user = 1;
}

// 修改密码请求
message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

// 修改密码响应
message ChangePasswordResponse {}

// 认证服务
service AuthService {
  // 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // 获取当前用户信息
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  // 修改密码
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

// ================================
// 人设服务
// ================================

// 获取人设列表请求
message ListPersonasRequest {}

// 获取人设列表响应
message ListPersonasResponse {
  repeated Persona personas = 1;
}

// 获取单个人设请求
message GetPersonaRequest {
  uint32 id = 1;
}

// 获取单个人设响应
message GetPersonaResponse {
  Persona persona = 1;
}

// 创建人设请求
message CreatePersonaRequest {
  string name = 1;
  optional string avatar = 2;
  optional string description = 3;
}

// 创建人设响应
message CreatePersonaResponse {
  Persona persona = 1;
}

// 更新人设请求
message UpdatePersonaRequest {
  uint32 id = 1;
  string name = 2;
  optional string avatar = 3;
  optional string description = 4;
}

// 更新人设响应
message UpdatePersonaResponse {
  Persona persona = 1;
}

// 删除人设请求
message DeletePersonaRequest {
  uint32 id = 1;
}

// 删除人设响应
message DeletePersonaResponse {}

// 设置活跃人设请求
message SetActivePersonaRequest {
  uint32 persona_id = 1;
}

// 设置活跃人设响应
message SetActivePersonaResponse {}

// 人设服务
service PersonaService {
  // 获取人设列表
  rpc ListPersonas(ListPersonasRequest) returns (ListPersonasResponse);
  // 获取单个人设
  rpc GetPersona(GetPersonaRequest) returns (GetPersonaResponse);
  // 创建人设
  rpc CreatePersona(CreatePersonaRequest) returns (CreatePersonaResponse);
  // 更新人设
  rpc UpdatePersona(UpdatePersonaRequest) returns (UpdatePersonaResponse);
  // 删除人设
  rpc DeletePersona(DeletePersonaRequest) returns (DeletePersonaResponse);
  // 设置活跃人设
  rpc SetActivePersona(SetActivePersonaRequest) returns (SetActivePersonaResponse);
}

// ================================
// 用户设置服务
// ================================

// 获取用户设置请求
message GetUserSettingRequest {}

// 获取用户设置响应
message GetUserSettingResponse {
  UserSetting setting = 1;
}

// 更新用户设置请求
message UpdateUserSettingRequest {
  Theme theme = 1;
  string language = 2;
  bool send_on_enter = 3;
  bool show_timestamps = 4;
}

// 更新用户设置响应
message UpdateUserSettingResponse {
  UserSetting setting = 1;
}

// 用户设置服务
service UserSettingService {
  // 获取用户设置
  rpc GetUserSetting(GetUserSettingRequest) returns (GetUserSettingResponse);
  // 更新用户设置
  rpc UpdateUserSetting(UpdateUserSettingRequest) returns (UpdateUserSettingResponse);
}

// ================================
// 角色卡服务
// ================================

// 获取角色卡列表请求
message ListCharactersRequest {
  optional int32 page = 1;
  optional int32 page_size = 2;
}

// 获取角色卡列表响应
message ListCharactersResponse {
  repeated Character characters = 1;
  int32 total = 2;
}

// 获取单个角色卡请求
message GetCharacterRequest {
  uint32 id = 1;
}

// 获取单个角色卡响应
message GetCharacterResponse {
  Character character = 1;
}

// 创建角色卡请求
message CreateCharacterRequest {
  string name = 1;
  optional string avatar = 2;
  optional string description = 3;
  optional string personality = 4;
  optional string scenario = 5;
  optional string first_message = 6;
  optional string example_dialogue = 7;
  optional string creator_notes = 8;
  optional string system_prompt = 9;
  optional uint32 world_info_id = 10;
}

// 创建角色卡响应
message CreateCharacterResponse {
  Character character = 1;
}

// 更新角色卡请求
message UpdateCharacterRequest {
  uint32 id = 1;
  string name = 2;
  optional string avatar = 3;
  optional string description = 4;
  optional string personality = 5;
  optional string scenario = 6;
  optional string first_message = 7;
  optional string example_dialogue = 8;
  optional string creator_notes = 9;
  optional string system_prompt = 10;
  optional uint32 world_info_id = 11;
  uint32 version = 12;  // 乐观锁版本号
}

// 更新角色卡响应
message UpdateCharacterResponse {
  Character character = 1;
}

// 删除角色卡请求
message DeleteCharacterRequest {
  uint32 id = 1;
}

// 删除角色卡响应
message DeleteCharacterResponse {}

// 导入角色卡请求
message ImportCharacterRequest {
  bytes file_content = 1;  // PNG图片或JSON文件内容
  string file_name = 2;    // 文件名，用于判断格式
}

// 导入角色卡响应
message ImportCharacterResponse {
  Character character = 1;
}

// 导出角色卡请求
message ExportCharacterRequest {
  uint32 id = 1;
  string format = 2;  // "png" 或 "json"
}

// 导出角色卡响应
message ExportCharacterResponse {
  bytes file_content = 1;
  string file_name = 2;
}

// 恢复角色卡世界书请求
message RestoreCharacterWorldInfoRequest {
  uint32 character_id = 1;
}

// 恢复角色卡世界书响应
message RestoreCharacterWorldInfoResponse {
  WorldInfo world_info = 1;
}

// 角色卡服务
service CharacterService {
  // 获取角色卡列表
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse);
  // 获取单个角色卡
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterResponse);
  // 创建角色卡
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  // 更新角色卡
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);
  // 删除角色卡
  rpc DeleteCharacter(DeleteCharacterRequest) returns (DeleteCharacterResponse);
  // 导入角色卡（支持SillyTavern格式）
  rpc ImportCharacter(ImportCharacterRequest) returns (ImportCharacterResponse);
  // 导出角色卡
  rpc ExportCharacter(ExportCharacterRequest) returns (ExportCharacterResponse);
  // 恢复角色卡的世界书（从备份恢复）
  rpc RestoreCharacterWorldInfo(RestoreCharacterWorldInfoRequest) returns (RestoreCharacterWorldInfoResponse);
}

// ================================
// 聊天服务
// ================================

// 获取会话列表请求
message ListChatSessionsRequest {
  optional uint32 character_id = 1;  // 可选，按角色筛选
  optional int32 page = 2;
  optional int32 page_size = 3;
}

// 获取会话列表响应
message ListChatSessionsResponse {
  repeated ChatSession sessions = 1;
  int32 total = 2;
}

// 获取单个会话请求
message GetChatSessionRequest {
  uint32 id = 1;
  bool include_messages = 2;  // 是否包含消息
}

// 获取单个会话响应
message GetChatSessionResponse {
  ChatSession session = 1;
}

// 创建会话请求
message CreateChatSessionRequest {
  uint32 character_id = 1;
  optional string name = 2;
}

// 创建会话响应
message CreateChatSessionResponse {
  ChatSession session = 1;
}

// 更新会话请求
message UpdateChatSessionRequest {
  uint32 id = 1;
  optional string name = 2;
  uint32 version = 3;  // 乐观锁版本号
}

// 更新会话响应
message UpdateChatSessionResponse {
  ChatSession session = 1;
}

// 删除会话请求
message DeleteChatSessionRequest {
  uint32 id = 1;
}

// 删除会话响应
message DeleteChatSessionResponse {}

// 发送消息请求
message SendMessageRequest {
  uint32 session_id = 1;
  string content = 2;
}

// 发送消息响应（流式）
message SendMessageResponse {
  Message user_message = 1;       // 用户消息（首次返回）
  Message assistant_message = 2;  // AI消息（首次返回结构，后续返回内容增量）
  string content_delta = 3;       // 内容增量
  bool is_complete = 4;           // 是否完成
}

// 重新生成消息请求
message RegenerateMessageRequest {
  uint32 message_id = 1;  // 要重新生成的AI消息ID
}

// 重新生成消息响应（流式）
message RegenerateMessageResponse {
  MessageSwipe new_swipe = 1;  // 新的swipe
  string content_delta = 2;    // 内容增量
  bool is_complete = 3;        // 是否完成
}

// 编辑消息请求
message EditMessageRequest {
  uint32 message_id = 1;
  uint32 swipe_id = 2;     // 要编辑的swipe ID
  string content = 3;      // 新内容
}

// 编辑消息响应
message EditMessageResponse {
  MessageSwipe swipe = 1;
}

// 删除消息请求
message DeleteMessageRequest {
  uint32 message_id = 1;
}

// 删除消息响应
message DeleteMessageResponse {}

// 切换Swipe请求
message SwitchSwipeRequest {
  uint32 message_id = 1;
  int32 swipe_index = 2;
}

// 切换Swipe响应
message SwitchSwipeResponse {
  Message message = 1;
}

// 聊天服务
service ChatService {
  // 获取会话列表
  rpc ListChatSessions(ListChatSessionsRequest) returns (ListChatSessionsResponse);
  // 获取单个会话
  rpc GetChatSession(GetChatSessionRequest) returns (GetChatSessionResponse);
  // 创建会话
  rpc CreateChatSession(CreateChatSessionRequest) returns (CreateChatSessionResponse);
  // 更新会话
  rpc UpdateChatSession(UpdateChatSessionRequest) returns (UpdateChatSessionResponse);
  // 删除会话
  rpc DeleteChatSession(DeleteChatSessionRequest) returns (DeleteChatSessionResponse);
  // 发送消息（流式响应）
  rpc SendMessage(SendMessageRequest) returns (stream SendMessageResponse);
  // 重新生成消息（流式响应）
  rpc RegenerateMessage(RegenerateMessageRequest) returns (stream RegenerateMessageResponse);
  // 编辑消息
  rpc EditMessage(EditMessageRequest) returns (EditMessageResponse);
  // 删除消息
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  // 切换Swipe
  rpc SwitchSwipe(SwitchSwipeRequest) returns (SwitchSwipeResponse);
}

// ================================
// 预设服务
// ================================

// 获取预设列表请求
message ListPresetsRequest {}

// 获取预设列表响应
message ListPresetsResponse {
  repeated Preset presets = 1;
}

// 获取单个预设请求
message GetPresetRequest {
  uint32 id = 1;
}

// 获取单个预设响应
message GetPresetResponse {
  Preset preset = 1;
}

// 创建预设请求
message CreatePresetRequest {
  string name = 1;
  double temperature = 2;
  double top_p = 3;
  int32 top_k = 4;
  int32 max_tokens = 5;
  double frequency_penalty = 6;
  double presence_penalty = 7;
  repeated CreatePromptItemRequest prompt_items = 8;
  repeated CreateRegexRuleRequest regex_rules = 9;
}

// 创建提示项请求（嵌套）
message CreatePromptItemRequest {
  string identifier = 1;
  string name = 2;
  optional string content = 3;
  PromptItemRole role = 4;
  bool is_enabled = 5;
  InjectionPosition injection_position = 6;
  int32 injection_depth = 7;
  bool forbid_overrides = 8;
  int32 sort_order = 9;
}

// 创建正则规则请求（嵌套）
message CreateRegexRuleRequest {
  string name = 1;
  string find_pattern = 2;
  optional string replace_pattern = 3;
  bool is_enabled = 4;
  bool run_on_edit = 5;
  bool substitute_regex = 6;
  optional int32 min_depth = 7;
  optional int32 max_depth = 8;
  uint32 affect_flags = 9;
  int32 sort_order = 10;
}

// 创建预设响应
message CreatePresetResponse {
  Preset preset = 1;
}

// 更新预设请求
message UpdatePresetRequest {
  uint32 id = 1;
  string name = 2;
  double temperature = 3;
  double top_p = 4;
  int32 top_k = 5;
  int32 max_tokens = 6;
  double frequency_penalty = 7;
  double presence_penalty = 8;
  uint32 version = 9;  // 乐观锁版本号
}

// 更新预设响应
message UpdatePresetResponse {
  Preset preset = 1;
}

// 删除预设请求
message DeletePresetRequest {
  uint32 id = 1;
}

// 删除预设响应
message DeletePresetResponse {}

// 设置活跃预设请求
message SetActivePresetRequest {
  uint32 preset_id = 1;
}

// 设置活跃预设响应
message SetActivePresetResponse {}

// 导入预设请求
message ImportPresetRequest {
  bytes file_content = 1;  // JSON文件内容
  string file_name = 2;
}

// 导入预设响应
message ImportPresetResponse {
  Preset preset = 1;
}

// 导出预设请求
message ExportPresetRequest {
  uint32 id = 1;
}

// 导出预设响应
message ExportPresetResponse {
  bytes file_content = 1;
  string file_name = 2;
}

// 预设服务
service PresetService {
  // 获取预设列表
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  // 获取单个预设
  rpc GetPreset(GetPresetRequest) returns (GetPresetResponse);
  // 创建预设
  rpc CreatePreset(CreatePresetRequest) returns (CreatePresetResponse);
  // 更新预设
  rpc UpdatePreset(UpdatePresetRequest) returns (UpdatePresetResponse);
  // 删除预设
  rpc DeletePreset(DeletePresetRequest) returns (DeletePresetResponse);
  // 设置活跃预设
  rpc SetActivePreset(SetActivePresetRequest) returns (SetActivePresetResponse);
  // 导入预设（支持SillyTavern格式）
  rpc ImportPreset(ImportPresetRequest) returns (ImportPresetResponse);
  // 导出预设
  rpc ExportPreset(ExportPresetRequest) returns (ExportPresetResponse);
}

// ================================
// 提示项服务
// ================================

// 获取预设的提示项列表请求
message ListPromptItemsRequest {
  uint32 preset_id = 1;
}

// 获取预设的提示项列表响应
message ListPromptItemsResponse {
  repeated PromptItem items = 1;
}

// 创建提示项请求
message AddPromptItemRequest {
  uint32 preset_id = 1;
  string identifier = 2;
  string name = 3;
  optional string content = 4;
  PromptItemRole role = 5;
  bool is_enabled = 6;
  InjectionPosition injection_position = 7;
  int32 injection_depth = 8;
  bool forbid_overrides = 9;
  int32 sort_order = 10;
}

// 创建提示项响应
message AddPromptItemResponse {
  PromptItem item = 1;
}

// 更新提示项请求
message UpdatePromptItemRequest {
  uint32 id = 1;
  string identifier = 2;
  string name = 3;
  optional string content = 4;
  PromptItemRole role = 5;
  bool is_enabled = 6;
  InjectionPosition injection_position = 7;
  int32 injection_depth = 8;
  bool forbid_overrides = 9;
  int32 sort_order = 10;
}

// 更新提示项响应
message UpdatePromptItemResponse {
  PromptItem item = 1;
}

// 删除提示项请求
message DeletePromptItemRequest {
  uint32 id = 1;
}

// 删除提示项响应
message DeletePromptItemResponse {}

// 批量更新提示项排序请求
message UpdatePromptItemsOrderRequest {
  uint32 preset_id = 1;
  repeated uint32 item_ids = 2;  // 按新顺序排列的ID列表
}

// 批量更新提示项排序响应
message UpdatePromptItemsOrderResponse {}

// 提示项服务
service PromptItemService {
  // 获取预设的提示项列表
  rpc ListPromptItems(ListPromptItemsRequest) returns (ListPromptItemsResponse);
  // 添加提示项
  rpc AddPromptItem(AddPromptItemRequest) returns (AddPromptItemResponse);
  // 更新提示项
  rpc UpdatePromptItem(UpdatePromptItemRequest) returns (UpdatePromptItemResponse);
  // 删除提示项
  rpc DeletePromptItem(DeletePromptItemRequest) returns (DeletePromptItemResponse);
  // 批量更新提示项排序
  rpc UpdatePromptItemsOrder(UpdatePromptItemsOrderRequest) returns (UpdatePromptItemsOrderResponse);
}

// ================================
// 正则规则服务
// ================================

// 获取预设的正则规则列表请求
message ListRegexRulesRequest {
  uint32 preset_id = 1;
}

// 获取预设的正则规则列表响应
message ListRegexRulesResponse {
  repeated RegexRule rules = 1;
}

// 添加正则规则请求
message AddRegexRuleRequest {
  uint32 preset_id = 1;
  string name = 2;
  string find_pattern = 3;
  optional string replace_pattern = 4;
  bool is_enabled = 5;
  bool run_on_edit = 6;
  bool substitute_regex = 7;
  optional int32 min_depth = 8;
  optional int32 max_depth = 9;
  uint32 affect_flags = 10;
  int32 sort_order = 11;
}

// 添加正则规则响应
message AddRegexRuleResponse {
  RegexRule rule = 1;
}

// 更新正则规则请求
message UpdateRegexRuleRequest {
  uint32 id = 1;
  string name = 2;
  string find_pattern = 3;
  optional string replace_pattern = 4;
  bool is_enabled = 5;
  bool run_on_edit = 6;
  bool substitute_regex = 7;
  optional int32 min_depth = 8;
  optional int32 max_depth = 9;
  uint32 affect_flags = 10;
  int32 sort_order = 11;
}

// 更新正则规则响应
message UpdateRegexRuleResponse {
  RegexRule rule = 1;
}

// 删除正则规则请求
message DeleteRegexRuleRequest {
  uint32 id = 1;
}

// 删除正则规则响应
message DeleteRegexRuleResponse {}

// 批量更新正则规则排序请求
message UpdateRegexRulesOrderRequest {
  uint32 preset_id = 1;
  repeated uint32 rule_ids = 2;  // 按新顺序排列的ID列表
}

// 批量更新正则规则排序响应
message UpdateRegexRulesOrderResponse {}

// 正则规则服务
service RegexRuleService {
  // 获取预设的正则规则列表
  rpc ListRegexRules(ListRegexRulesRequest) returns (ListRegexRulesResponse);
  // 添加正则规则
  rpc AddRegexRule(AddRegexRuleRequest) returns (AddRegexRuleResponse);
  // 更新正则规则
  rpc UpdateRegexRule(UpdateRegexRuleRequest) returns (UpdateRegexRuleResponse);
  // 删除正则规则
  rpc DeleteRegexRule(DeleteRegexRuleRequest) returns (DeleteRegexRuleResponse);
  // 批量更新正则规则排序
  rpc UpdateRegexRulesOrder(UpdateRegexRulesOrderRequest) returns (UpdateRegexRulesOrderResponse);
}

// ================================
// 世界书服务
// ================================

// 获取世界书列表请求
message ListWorldInfosRequest {
  optional bool is_global = 1;  // 可选，筛选全局/非全局
}

// 获取世界书列表响应
message ListWorldInfosResponse {
  repeated WorldInfo world_infos = 1;
}

// 获取单个世界书请求
message GetWorldInfoRequest {
  uint32 id = 1;
}

// 获取单个世界书响应
message GetWorldInfoResponse {
  WorldInfo world_info = 1;
}

// 创建世界书请求
message CreateWorldInfoRequest {
  string name = 1;
  optional string description = 2;
  bool is_global = 3;
}

// 创建世界书响应
message CreateWorldInfoResponse {
  WorldInfo world_info = 1;
}

// 更新世界书请求
message UpdateWorldInfoRequest {
  uint32 id = 1;
  string name = 2;
  optional string description = 3;
  bool is_global = 4;
}

// 更新世界书响应
message UpdateWorldInfoResponse {
  WorldInfo world_info = 1;
}

// 删除世界书请求
message DeleteWorldInfoRequest {
  uint32 id = 1;
}

// 删除世界书响应
message DeleteWorldInfoResponse {}

// 导入世界书请求
message ImportWorldInfoRequest {
  bytes file_content = 1;  // JSON文件内容
  string file_name = 2;
}

// 导入世界书响应
message ImportWorldInfoResponse {
  WorldInfo world_info = 1;
}

// 导出世界书请求
message ExportWorldInfoRequest {
  uint32 id = 1;
}

// 导出世界书响应
message ExportWorldInfoResponse {
  bytes file_content = 1;
  string file_name = 2;
}

// 世界书服务
service WorldInfoService {
  // 获取世界书列表
  rpc ListWorldInfos(ListWorldInfosRequest) returns (ListWorldInfosResponse);
  // 获取单个世界书
  rpc GetWorldInfo(GetWorldInfoRequest) returns (GetWorldInfoResponse);
  // 创建世界书
  rpc CreateWorldInfo(CreateWorldInfoRequest) returns (CreateWorldInfoResponse);
  // 更新世界书
  rpc UpdateWorldInfo(UpdateWorldInfoRequest) returns (UpdateWorldInfoResponse);
  // 删除世界书
  rpc DeleteWorldInfo(DeleteWorldInfoRequest) returns (DeleteWorldInfoResponse);
  // 导入世界书（支持SillyTavern格式）
  rpc ImportWorldInfo(ImportWorldInfoRequest) returns (ImportWorldInfoResponse);
  // 导出世界书
  rpc ExportWorldInfo(ExportWorldInfoRequest) returns (ExportWorldInfoResponse);
}

// ================================
// 世界书条目服务
// ================================

// 获取世界书条目列表请求
message ListWorldInfoEntriesRequest {
  uint32 world_info_id = 1;
}

// 获取世界书条目列表响应
message ListWorldInfoEntriesResponse {
  repeated WorldInfoEntry entries = 1;
}

// 添加世界书条目请求
message AddWorldInfoEntryRequest {
  uint32 world_info_id = 1;
  optional string uid = 2;
  string keys_list = 3;
  optional string secondary_keys = 4;
  string content = 5;
  optional string comment = 6;
  bool is_enabled = 7;
  bool constant = 8;
  bool selective = 9;
  int32 insertion_order = 10;
  EntryPosition position = 11;
  int32 depth = 12;
  int32 sort_order = 13;
}

// 添加世界书条目响应
message AddWorldInfoEntryResponse {
  WorldInfoEntry entry = 1;
}

// 更新世界书条目请求
message UpdateWorldInfoEntryRequest {
  uint32 id = 1;
  optional string uid = 2;
  string keys_list = 3;
  optional string secondary_keys = 4;
  string content = 5;
  optional string comment = 6;
  bool is_enabled = 7;
  bool constant = 8;
  bool selective = 9;
  int32 insertion_order = 10;
  EntryPosition position = 11;
  int32 depth = 12;
  int32 sort_order = 13;
}

// 更新世界书条目响应
message UpdateWorldInfoEntryResponse {
  WorldInfoEntry entry = 1;
}

// 删除世界书条目请求
message DeleteWorldInfoEntryRequest {
  uint32 id = 1;
}

// 删除世界书条目响应
message DeleteWorldInfoEntryResponse {}

// 批量更新世界书条目排序请求
message UpdateWorldInfoEntriesOrderRequest {
  uint32 world_info_id = 1;
  repeated uint32 entry_ids = 2;  // 按新顺序排列的ID列表
}

// 批量更新世界书条目排序响应
message UpdateWorldInfoEntriesOrderResponse {}

// 世界书条目服务
service WorldInfoEntryService {
  // 获取世界书条目列表
  rpc ListWorldInfoEntries(ListWorldInfoEntriesRequest) returns (ListWorldInfoEntriesResponse);
  // 添加世界书条目
  rpc AddWorldInfoEntry(AddWorldInfoEntryRequest) returns (AddWorldInfoEntryResponse);
  // 更新世界书条目
  rpc UpdateWorldInfoEntry(UpdateWorldInfoEntryRequest) returns (UpdateWorldInfoEntryResponse);
  // 删除世界书条目
  rpc DeleteWorldInfoEntry(DeleteWorldInfoEntryRequest) returns (DeleteWorldInfoEntryResponse);
  // 批量更新世界书条目排序
  rpc UpdateWorldInfoEntriesOrder(UpdateWorldInfoEntriesOrderRequest) returns (UpdateWorldInfoEntriesOrderResponse);
}

// ================================
// API配置服务
// ================================

// 获取API配置列表请求
message ListAPIConfigsRequest {}

// 获取API配置列表响应
message ListAPIConfigsResponse {
  repeated APIConfig configs = 1;
}

// 获取单个API配置请求
message GetAPIConfigRequest {
  uint32 id = 1;
}

// 获取单个API配置响应
message GetAPIConfigResponse {
  APIConfig config = 1;
}

// 创建API配置请求
message CreateAPIConfigRequest {
  string name = 1;
  APIProvider provider = 2;
  string api_key = 3;
  optional string base_url = 4;
  optional string model = 5;
}

// 创建API配置响应
message CreateAPIConfigResponse {
  APIConfig config = 1;
}

// 更新API配置请求
message UpdateAPIConfigRequest {
  uint32 id = 1;
  string name = 2;
  APIProvider provider = 3;
  optional string api_key = 4;  // 可选，不传则不更新
  optional string base_url = 5;
  optional string model = 6;
}

// 更新API配置响应
message UpdateAPIConfigResponse {
  APIConfig config = 1;
}

// 删除API配置请求
message DeleteAPIConfigRequest {
  uint32 id = 1;
}

// 删除API配置响应
message DeleteAPIConfigResponse {}

// 设置活跃API配置请求
message SetActiveAPIConfigRequest {
  uint32 config_id = 1;
}

// 设置活跃API配置响应
message SetActiveAPIConfigResponse {}

// 测试API配置请求
message TestAPIConfigRequest {
  uint32 id = 1;
}

// 测试API配置响应
message TestAPIConfigResponse {
  bool success = 1;
  optional string error_message = 2;
  optional string model_info = 3;  // 返回的模型信息
}

// API配置服务
service APIConfigService {
  // 获取API配置列表
  rpc ListAPIConfigs(ListAPIConfigsRequest) returns (ListAPIConfigsResponse);
  // 获取单个API配置
  rpc GetAPIConfig(GetAPIConfigRequest) returns (GetAPIConfigResponse);
  // 创建API配置
  rpc CreateAPIConfig(CreateAPIConfigRequest) returns (CreateAPIConfigResponse);
  // 更新API配置
  rpc UpdateAPIConfig(UpdateAPIConfigRequest) returns (UpdateAPIConfigResponse);
  // 删除API配置
  rpc DeleteAPIConfig(DeleteAPIConfigRequest) returns (DeleteAPIConfigResponse);
  // 设置活跃API配置
  rpc SetActiveAPIConfig(SetActiveAPIConfigRequest) returns (SetActiveAPIConfigResponse);
  // 测试API配置连接
  rpc TestAPIConfig(TestAPIConfigRequest) returns (TestAPIConfigResponse);
}
