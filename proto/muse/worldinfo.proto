syntax = "proto3";

package muse;

import "muse/common.proto";

option go_package = "github.com/ling/muse/gen/muse;muse";

// ================================
// 世界书相关消息
// ================================

// WorldInfo 世界书，存储角色相关的背景知识
message WorldInfo {
  int32 id = 1;                          // 世界书唯一标识ID
  int32 user_id = 2;                     // 所属用户ID
  string name = 3;                       // 世界书名称
  string description = 4;                // 世界书描述
  bool is_global = 5;                    // 是否为全局世界书，全局世界书对所有角色生效
  int64 created_at = 6;                  // 创建时间（Unix时间戳）
  int64 updated_at = 7;                  // 最后更新时间（Unix时间戳）
  repeated WorldInfoEntry entries = 8;   // 世界书条目列表（可选加载）
}

// WorldInfoEntry 世界书条目，单条背景知识
message WorldInfoEntry {
  int32 id = 1;               // 条目唯一标识ID
  int32 world_info_id = 2;    // 所属世界书ID
  string uid = 3;             // 条目唯一标识符（用于导入导出）
  repeated string keys_list = 4;       // 主关键词列表，逗号分隔，匹配时触发条目
  repeated string secondary_keys = 5;  // 次要关键词列表，与主关键词配合使用
  string content = 6;         // 条目内容，注入到提示词中的文本
  string comment = 7;         // 条目备注，仅用于管理不会注入
  bool is_enabled = 8;        // 是否启用
  bool constant = 9;          // 是否常驻，常驻条目始终注入不需要关键词匹配
  bool selective = 10;        // 选择性匹配，需同时匹配主关键词和次要关键词
  int32 insertion_order = 11; // 插入优先级，数值越小优先级越高
  EntryPosition position = 12; // 插入位置类型
  int32 depth = 13;           // 插入深度，AtDepth位置时的深度值
  int32 sort_order = 14;      // 排序序号
  int64 created_at = 15;      // 创建时间（Unix时间戳）
  int64 updated_at = 16;      // 最后更新时间（Unix时间戳）
  Role role = 17;             // 消息角色类型，用于区分该条目的作用角色
}

message WorldInfoWithLen {
  WorldInfo world_info = 1;
  int32 entry_length = 2;
}

// ================================
// 世界书服务
// ================================

// 获取世界书列表请求
message ListWorldInfosReq {
  optional bool is_global = 1;  // 可选，筛选全局/非全局
  optional int32 page = 2;      // 页码，从1开始，默认为1
  optional int32 page_size = 3; // 每页数量，默认为20，最大100
}

// 获取世界书列表响应
message ListWorldInfosRsp {
  repeated WorldInfoWithLen world_infos = 1;
  int64 total = 2;  // 总数
  int32 page = 3;   // 当前页码
  int32 page_size = 4; // 每页数量
}

// 获取单个世界书请求
message GetWorldInfoReq {
  int32 id = 1;
}

// 获取单个世界书响应
message GetWorldInfoRsp {
  WorldInfo world_info = 1;
}

// 创建世界书请求
message CreateWorldInfoReq {
  string name = 1;
  optional string description = 2;
  bool is_global = 3;
}

// 创建世界书响应
message CreateWorldInfoRsp {
  WorldInfo world_info = 1;
}

// 更新世界书请求
message UpdateWorldInfoReq {
  int32 id = 1;
  string name = 2;
  optional string description = 3;
  bool is_global = 4;
}

// 更新世界书响应
message UpdateWorldInfoRsp {
  WorldInfo world_info = 1;
}

// 删除世界书请求
message DeleteWorldInfoReq {
  int32 id = 1;
}

// 删除世界书响应
message DeleteWorldInfoRsp {}

// 导入世界书请求
message ImportWorldInfoReq {
  bytes file_content = 1;  // JSON文件内容
  string file_name = 2;
}

// 导入世界书响应
message ImportWorldInfoRsp {
  WorldInfo world_info = 1;
}

// 导出世界书请求
message ExportWorldInfoReq {
  int32 id = 1;
}

// 导出世界书响应
message ExportWorldInfoRsp {
  bytes file_content = 1;
  string file_name = 2;
}

// 获取世界书条目列表请求
message ListWorldInfoEntriesReq {
  int32 world_info_id = 1;
}

// 获取世界书条目列表响应
message ListWorldInfoEntriesRsp {
  repeated WorldInfoEntry entries = 1;
}

// 添加世界书条目请求
message AddWorldInfoEntryReq {
  int32 world_info_id = 1;
  optional string uid = 2;
  repeated string keys_list = 3;
  repeated string secondary_keys = 4;
  string content = 5;
  optional string comment = 6;
  bool is_enabled = 7;
  bool constant = 8;
  bool selective = 9;
  int32 insertion_order = 10;
  EntryPosition position = 11;
  int32 depth = 12;
  Role role = 14;             // 消息角色类型，用于区分该条目的作用角色
  int32 sort_order = 13;
}

// 添加世界书条目响应
message AddWorldInfoEntryRsp {
  WorldInfoEntry entry = 1;
}

// 更新世界书条目请求
message UpdateWorldInfoEntryReq {
  int32 id = 1;
  optional string uid = 2;
  repeated string keys_list = 3;
  repeated string secondary_keys = 4;
  string content = 5;
  optional string comment = 6;
  bool is_enabled = 7;
  bool constant = 8;
  bool selective = 9;
  int32 insertion_order = 10;
  EntryPosition position = 11;
  int32 depth = 12;
  Role role = 14;             // 消息角色类型，用于区分该条目的作用角色
  int32 sort_order = 13;
}

// 更新世界书条目响应
message UpdateWorldInfoEntryRsp {
  WorldInfoEntry entry = 1;
}

// 删除世界书条目请求
message DeleteWorldInfoEntryReq {
  int32 id = 1;
}

// 删除世界书条目响应
message DeleteWorldInfoEntryRsp {}

// 批量更新世界书条目排序请求
message UpdateWorldInfoEntriesOrderReq {
  int32 world_info_id = 1;
  repeated int32 entry_ids = 2;  // 按新顺序排列的ID列表
}

// 批量更新世界书条目排序响应
message UpdateWorldInfoEntriesOrderRsp {}

// 世界书服务（包含世界书和世界书条目的管理）
service WorldInfoService {
  // 获取世界书列表
  rpc ListWorldInfos(ListWorldInfosReq) returns (ListWorldInfosRsp);
  // 获取单个世界书
  rpc GetWorldInfo(GetWorldInfoReq) returns (GetWorldInfoRsp);
  // 创建世界书
  rpc CreateWorldInfo(CreateWorldInfoReq) returns (CreateWorldInfoRsp);
  // 更新世界书
  rpc UpdateWorldInfo(UpdateWorldInfoReq) returns (UpdateWorldInfoRsp);
  // 删除世界书
  rpc DeleteWorldInfo(DeleteWorldInfoReq) returns (DeleteWorldInfoRsp);
  // 导入世界书（支持SillyTavern格式）
  rpc ImportWorldInfo(ImportWorldInfoReq) returns (ImportWorldInfoRsp);
  // 导出世界书
  rpc ExportWorldInfo(ExportWorldInfoReq) returns (ExportWorldInfoRsp);

  // 获取世界书条目列表
  rpc ListWorldInfoEntries(ListWorldInfoEntriesReq) returns (ListWorldInfoEntriesRsp);
  // 添加世界书条目
  rpc AddWorldInfoEntry(AddWorldInfoEntryReq) returns (AddWorldInfoEntryRsp);
  // 更新世界书条目
  rpc UpdateWorldInfoEntry(UpdateWorldInfoEntryReq) returns (UpdateWorldInfoEntryRsp);
  // 删除世界书条目
  rpc DeleteWorldInfoEntry(DeleteWorldInfoEntryReq) returns (DeleteWorldInfoEntryRsp);
  // 批量更新世界书条目排序
  rpc UpdateWorldInfoEntriesOrder(UpdateWorldInfoEntriesOrderReq) returns (UpdateWorldInfoEntriesOrderRsp);
}